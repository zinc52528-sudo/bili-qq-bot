name: astrbot_plugin_dynamic_push
desc: B 站动态推送：按安全间隔轮询指定 UP 的最新动态（文字/图文/视频/转发等）与直播预约，发现新动态即推送到指定会话。带 WBI 签名与登录态，兼容 IP 风控（失败自动跳过并退避）。
help: |
  【配置项】
  - uids：要监控的 UP 主，格式 mid:名称，多个用英文逗号分隔。推荐用指令管理（见下方）
  - check_interval_minutes：轮询间隔（分钟），默认 3（B 站动态接口有风控，建议不低于 3）
  - push_target：推送目标会话（支持多个，英文逗号分隔），默认 default:FriendMessage:943867461,default:GroupMessage:1041495420
  - bili_cookie_path：B 站登录态 cookies 路径（默认复用 bilivideo 插件的）
  - max_preview_chars：单条消息正文上限（字符）。0=完整推送并自动分段（推荐）；>0 时作为单段上限

  【直播预约】
  - 新动态带直播预约卡（ADDITIONAL_TYPE_RESERVE）时推送预约提醒（标题/时间/人数）
  - LIVE_RCMD 且为预约待开播态时推送开播预告；已开播由 livemonitor 负责，避免重复

  【与 bilivideo 的分工】
  - 本插件只推【非视频】动态：文字/图文/转发/专栏/直播预约/开播预告
  - 纯视频动态（投稿视频）统一由 bilivideo 插件推送（含 AI 总结），本插件已跳过，避免重复推送
  - 因此请确保订阅的 UP 主也已在 bilivideo 订阅，否则其视频动态将收不到推送

  【订阅管理指令（比改配置更直观）】
  - /动态订阅 或 /动态订阅列表：查看当前订阅的 UP 主
  - /动态订阅添加 <UID 或 space.bilibili.com/123 或昵称>：新增订阅（自动补全昵称并持久化）
  - /动态订阅移除 <UID 或昵称>：取消订阅

  【状态指令】
  - /动态状态：查看监控的 UP、已记录的最新动态 ID 与下次检查时间
